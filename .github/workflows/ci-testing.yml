name: CI Testing

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix packages/client ci
      - run: npm run lint
      - run: npm --prefix packages/client run lint
      - run: npm test
      - run: npm run build
